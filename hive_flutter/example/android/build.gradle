allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

def flutterBuildDir = rootProject.layout.projectDirectory.dir("../build")
rootProject.layout.buildDirectory.set(flutterBuildDir)
subprojects { subproject ->
    subproject.layout.buildDirectory.set(flutterBuildDir.dir(subproject.name))
}

tasks.register("clean", Delete) {
    delete rootProject.layout.buildDirectory
}
