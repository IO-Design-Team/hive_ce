analyzer:
  errors:
    # Beta deprecates package:flutter/material.dart. Kept until the 3.0 migration.
    deprecated_member_use: ignore
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
include: package:rexios_lints/flutter/core_extra.yaml

linter:
  rules:
    migrate_design_widgets: false
