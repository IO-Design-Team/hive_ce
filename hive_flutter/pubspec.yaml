name: hive_ce_flutter
description: Extension for Hive. Makes it easier to use Hive in Flutter apps.
version: 2.6.0
homepage: https://github.com/IO-Design-Team/hive_ce/tree/main/hive_flutter

environment:
  sdk: ^3.10.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

  hive_ce: ^2.24.0
  material_ui: ^1.0.0
  path_provider: ^2.0.10
  path: ^1.8.2
  hooks: ^2.0.2
  code_assets: '>=1.2.1 <3.0.0'
  native_toolchain_c: ^0.19.2

dev_dependencies:
  test: ^1.21.1
  path_provider_platform_interface: ^2.0.0
  rexios_lints: ^19.0.0
  mockito: ^5.4.1
  build_runner: ^2.16.2
