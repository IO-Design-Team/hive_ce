name: hive_ce_flutter
description: Extension for Hive. Makes it easier to use Hive in Flutter apps.
version: 2.4.0
homepage: https://github.com/IO-Design-Team/hive_ce/tree/main/hive_flutter

environment:
  sdk: ^3.4.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

  hive_ce: ^2.16.0
  material_ui: ^1.0.0
  path_provider: ^2.0.10
  path: ^1.8.2

dev_dependencies:
  # build_runner 2.16.1 still sets AnalysisOptionsImpl.contextFeatures, removed in 14.5.0.
  analyzer: '>=14.0.0 <14.5.0'
  test: ^1.21.1
  path_provider_platform_interface: ^2.0.0
  rexios_lints: ^19.0.0
  mockito: ^5.4.1
  build_runner: ^2.5.4
