name: Dart CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package:
          - hive
          - hive_ce_inspector
          - hive_flutter
          - hive_generator
        flutter-channel:
          - stable
          - beta
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ matrix.flutter-channel }}
      - run: |
          dart pub get
          dart format . --set-exit-if-changed
          dart analyze --fatal-infos

  test-hive:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - test-platform: vm
            compiler: kernel
          - test-platform: chrome
            compiler: dart2js
          - test-platform: chrome
            compiler: dart2wasm
    defaults:
      run:
        working-directory: hive
    steps:
      - uses: actions/checkout@v7
      - uses: browser-actions/setup-chrome@v2
        if: ${{ matrix.test-platform == 'chrome' }}
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.4.0
      # These dev dependencies require a newer SDK, but are not needed for testing
      - name: Remove rexios_lints
        run: |
          sed -i '/rexios_lints:/d' pubspec.yaml
          sed -i '/build_runner:/d' pubspec.yaml
          sed -i '/json_serializable:/d' pubspec.yaml
          sed -i '/analyzer:/d' pubspec.yaml
      - name: Install dependencies
        run: dart pub get --no-example
      - name: Run tests
        run: dart test -p ${{ matrix.test-platform }} -c ${{ matrix.compiler }}

  test-hive_ce_inspector:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hive_ce_inspector
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
      - name: Install dependencies
        run: flutter pub get
      - name: Run tests
        run: flutter test

  test-hive_flutter:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        flutter-channel: [stable, beta]
    defaults:
      run:
        working-directory: hive_flutter
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ matrix.flutter-channel }}
      - name: Install dependencies
        run: flutter pub get
      - name: Run tests
        run: flutter test

  integration-test-hive_flutter:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            os: ubuntu-latest
            device: emulator-5554
          - platform: ios
            os: macos-latest
            device: iPhone
          - platform: linux
            os: ubuntu-latest
            device: linux
          - platform: macos
            os: macos-latest
            device: macos
          - platform: windows
            os: windows-latest
            device: windows
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: hive_flutter/example
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
      - name: Set up Linux
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev
          Xvfb :99 &
          echo DISPLAY=:99 >> $GITHUB_ENV
      - name: Set up iOS
        if: matrix.platform == 'ios'
        run: |
          udid=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b
          echo "IOS_DEVICE=$udid" >> "$GITHUB_ENV"
      - name: Set up Android
        if: matrix.platform == 'android'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run tests
        if: matrix.platform != 'android'
        run: flutter test integration_test -d ${{ env.IOS_DEVICE || matrix.device }}
      - name: Run tests
        if: matrix.platform == 'android'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          working-directory: hive_flutter/example
          script: flutter test integration_test -d ${{ matrix.device }}

  test-hive_generator:
    strategy:
      matrix:
        include:
          - flutter-channel: stable
            os: ubuntu-latest
          - flutter-channel: stable
            # Test on windows since the generator directly accesses the file system
            os: windows-latest
          - flutter-channel: beta
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: hive_generator
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ matrix.flutter-channel }}
      - name: Install dependencies
        run: dart pub get
      - name: Run tests
        run: dart test

  ensure-codegen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
      # TODO: Figure out why puby gen needs to run twice
      - run: |
          dart pub global activate puby
          puby link
          puby gen
          puby gen
          dart format .
          git diff --exit-code

  ensure-embedme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          npx embedme **/*.md
          git diff --exit-code

  check-score:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [hive, hive_flutter, hive_generator]
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
      - run: |
          cd ${{ matrix.package }}
          flutter pub get
          dart pub global activate pana
          pana --no-warning --exit-code-threshold 0
