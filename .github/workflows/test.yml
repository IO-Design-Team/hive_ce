name: Dart CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      hive: ${{ github.event_name != 'pull_request' || steps.filter.outputs.hive == 'true' }}
      hive_flutter: ${{ github.event_name != 'pull_request' || steps.filter.outputs.hive_flutter == 'true' }}
      hive_generator: ${{ github.event_name != 'pull_request' || steps.filter.outputs.hive_generator == 'true' }}
      hive_ce_inspector: ${{ github.event_name != 'pull_request' || steps.filter.outputs.hive_ce_inspector == 'true' }}
      integration_flutter: ${{ github.event_name != 'pull_request' || steps.filter.outputs.integration_flutter == 'true' }}
      codegen: ${{ github.event_name != 'pull_request' || steps.filter.outputs.codegen == 'true' }}
      codegen_drift: ${{ github.event_name != 'pull_request' || steps.filter.outputs.codegen_drift == 'true' }}
      embedme: ${{ github.event_name != 'pull_request' || steps.filter.outputs.embedme == 'true' }}
    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            hive:
              - 'hive/**'
              - '.github/workflows/test.yml'
            hive_flutter:
              - 'hive_flutter/**'
              - '.github/workflows/test.yml'
            hive_generator:
              - 'hive_generator/**'
              - '.github/workflows/test.yml'
            hive_ce_inspector:
              - 'hive_ce_inspector/**'
              - 'hive/**'
              - '.github/workflows/test.yml'
            integration_flutter:
              - 'hive/**'
              - 'hive_flutter/**'
              - '.github/workflows/test.yml'
            codegen:
              - 'hive/**'
              - 'hive_flutter/**'
              - 'hive_generator/**'
              - '.github/workflows/test.yml'
            codegen_drift:
              - 'benchmarks/drift/**'
              - '.github/workflows/test.yml'
            embedme:
              - '**/*.md'
              - 'hive/readme/**'
              - '.github/workflows/test.yml'

  dart-checks:
    needs: changes
    if: needs.changes.outputs.hive == 'true' || needs.changes.outputs.hive_generator == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        dart-channel:
          - stable
          - beta
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.dart-channel }}
      - uses: actions/cache@v5
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-dart-${{ matrix.dart-channel }}-pub-${{ hashFiles('hive/pubspec.yaml', 'hive/example/pubspec.yaml', 'hive_generator/pubspec.yaml', 'hive_generator/example/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-dart-${{ matrix.dart-channel }}-pub-
      - name: Check hive
        if: needs.changes.outputs.hive == 'true'
        working-directory: hive
        run: |
          dart pub get
          dart format . --set-exit-if-changed
          dart analyze --fatal-infos
      - name: Check hive_generator/example against local hive
        if: needs.changes.outputs.hive == 'true' && needs.changes.outputs.hive_generator != 'true'
        working-directory: hive_generator/example
        run: |
          dart pub get
          dart analyze --fatal-infos
      - name: Check and test hive_generator
        if: needs.changes.outputs.hive_generator == 'true'
        working-directory: hive_generator
        run: |
          dart pub get
          dart format . --set-exit-if-changed
          dart analyze --fatal-infos
          dart test -j $(nproc)
      - name: Activate pana
        if: matrix.dart-channel == 'stable'
        run: dart pub global activate pana
      - name: Check pub score (hive)
        if: matrix.dart-channel == 'stable' && needs.changes.outputs.hive == 'true'
        working-directory: hive
        run: dart pub global run pana --no-warning --exit-code-threshold 0
      - name: Check pub score (hive_generator)
        if: matrix.dart-channel == 'stable' && needs.changes.outputs.hive_generator == 'true'
        working-directory: hive_generator
        run: dart pub global run pana --no-warning --exit-code-threshold 0

  test-hive_generator-windows:
    needs: changes
    if: needs.changes.outputs.hive_generator == 'true'
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: hive_generator
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
      - uses: actions/cache@v5
        with:
          path: ~/AppData/Local/Pub/Cache
          key: ${{ runner.os }}-dart-stable-pub-${{ hashFiles('hive_generator/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-dart-stable-pub-
      - name: Install dependencies
        run: dart pub get --no-example
      - name: Run tests
        run: dart test

  flutter-checks:
    needs: changes
    if: needs.changes.outputs.hive_flutter == 'true' || needs.changes.outputs.hive_ce_inspector == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        flutter-channel:
          - stable
          - beta
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ matrix.flutter-channel }}
          cache: true
          pub-cache-key: flutter-pub-:os:-:channel:-:version:-:arch:-${{ hashFiles('hive_flutter/pubspec.yaml', 'hive_flutter/example/pubspec.yaml', 'hive_ce_inspector/pubspec.yaml') }}
      - name: Check and test hive_flutter
        if: needs.changes.outputs.hive_flutter == 'true'
        working-directory: hive_flutter
        run: |
          flutter pub get
          (cd example && flutter pub get)
          dart format . --set-exit-if-changed
          dart analyze --fatal-infos
          flutter test
      - name: Check hive_flutter/example against local hive
        if: needs.changes.outputs.hive == 'true' && needs.changes.outputs.hive_flutter != 'true'
        working-directory: hive_flutter/example
        run: |
          flutter pub get
          dart analyze --fatal-infos
      - name: Check hive_ce_inspector
        if: needs.changes.outputs.hive_ce_inspector == 'true'
        working-directory: hive_ce_inspector
        run: |
          flutter pub get
          dart format . --set-exit-if-changed
          dart analyze --fatal-infos
      - name: Test hive_ce_inspector
        if: matrix.flutter-channel == 'stable' && needs.changes.outputs.hive_ce_inspector == 'true'
        working-directory: hive_ce_inspector
        run: flutter test
      - name: Check pub score (hive_flutter)
        if: matrix.flutter-channel == 'stable' && needs.changes.outputs.hive_flutter == 'true'
        working-directory: hive_flutter
        run: |
          dart pub global activate pana
          dart pub global run pana --no-warning --exit-code-threshold 0

  test-hive:
    needs: changes
    if: needs.changes.outputs.hive == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - test-platform: vm
            compiler: kernel
          - test-platform: chrome
            compiler: dart2js
          - test-platform: chrome
            compiler: dart2wasm
    defaults:
      run:
        working-directory: hive
    steps:
      - uses: actions/checkout@v7
      - uses: browser-actions/setup-chrome@v2
        if: ${{ matrix.test-platform == 'chrome' }}
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.4.0
      - uses: actions/cache@v5
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-dart-3.4.0-pub-${{ hashFiles('hive/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-dart-3.4.0-pub-
      # These dev dependencies require a newer SDK, but are not needed for testing
      - name: Remove rexios_lints
        run: |
          sed -i '/rexios_lints:/d' pubspec.yaml
          sed -i '/build_runner:/d' pubspec.yaml
          sed -i '/json_serializable:/d' pubspec.yaml
          sed -i '/analyzer:/d' pubspec.yaml
      - name: Install dependencies
        run: dart pub get --no-example
      - name: Run tests
        run: dart test -p ${{ matrix.test-platform }} -c ${{ matrix.compiler }} -j $(nproc)

  coverage-hive:
    needs: changes
    if: needs.changes.outputs.hive == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: hive
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
      - uses: actions/cache@v5
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-dart-stable-pub-${{ hashFiles('hive/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-dart-stable-pub-
      - name: Collect coverage
        run: |
          dart pub get --no-example
          dart test -j $(nproc) --coverage=coverage
          dart run coverage:format_coverage --lcov --in=coverage --out=coverage/lcov.info --package=. --report-on=lib
      - uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
          files: hive/coverage/lcov.info
          disable_search: true

  ensure-codegen:
    needs: changes
    if: needs.changes.outputs.codegen == 'true' || needs.changes.outputs.codegen_drift == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        if: needs.changes.outputs.hive_flutter == 'true'
        with:
          cache: true
          pub-cache-key: flutter-pub-:os:-:channel:-:version:-:arch:-codegen-${{ hashFiles('hive/pubspec.yaml', 'hive/example/pubspec.yaml', 'hive_flutter/pubspec.yaml', 'hive_generator/pubspec.yaml', 'hive_generator/example/pubspec.yaml', 'benchmarks/drift/pubspec.yaml') }}
      - uses: dart-lang/setup-dart@v1
        if: needs.changes.outputs.hive_flutter != 'true'
      - uses: actions/cache@v5
        if: needs.changes.outputs.hive_flutter != 'true'
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-dart-stable-codegen-pub-${{ hashFiles('hive/pubspec.yaml', 'hive/example/pubspec.yaml', 'hive_generator/pubspec.yaml', 'hive_generator/example/pubspec.yaml', 'benchmarks/drift/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-dart-stable-codegen-pub-
            ${{ runner.os }}-dart-stable-pub-
      - name: Run codegen
        env:
          HIVE: ${{ needs.changes.outputs.hive }}
          HIVE_FLUTTER: ${{ needs.changes.outputs.hive_flutter }}
          HIVE_GENERATOR: ${{ needs.changes.outputs.hive_generator }}
          CODEGEN_DRIFT: ${{ needs.changes.outputs.codegen_drift }}
        run: |
          pkgs=()
          if [[ "$HIVE" == "true" || "$HIVE_GENERATOR" == "true" ]]; then
            pkgs+=(hive hive/example hive_generator/example)
          fi
          if [[ "$HIVE_FLUTTER" == "true" ]]; then
            pkgs+=(hive_flutter)
          fi
          if [[ "$CODEGEN_DRIFT" == "true" ]]; then
            pkgs+=(benchmarks/drift)
          fi

          for pkg in "${pkgs[@]}"; do
            if [[ "$pkg" == "hive_flutter" ]]; then
              (cd "$pkg" && flutter pub get)
            elif [[ "$pkg" == "hive" ]]; then
              (cd "$pkg" && dart pub get --no-example)
            else
              (cd "$pkg" && dart pub get)
            fi
          done

          run_build_parallel() {
            local pids=()
            for pkg in "${pkgs[@]}"; do
              (cd "$pkg" && dart run build_runner build) &
              pids+=($!)
            done
            for pid in "${pids[@]}"; do
              wait "$pid"
            done
          }

          # TODO: Figure out why build_runner needs to run twice
          run_build_parallel
          run_build_parallel
          dart format "${pkgs[@]}"
          git diff --exit-code

  ensure-embedme:
    needs: changes
    if: needs.changes.outputs.embedme == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: |
          npx --yes embedme **/*.md
          git diff --exit-code

  integration-test-hive_flutter:
    needs: changes
    if: needs.changes.outputs.integration_flutter == 'true'
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            os: ubuntu-latest
            device: emulator-5554
          - platform: ios
            os: macos-latest
            device: iPhone
          - platform: linux
            os: ubuntu-latest
            device: linux
          - platform: macos
            os: macos-latest
            device: macos
          - platform: windows
            os: windows-latest
            device: windows
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: hive_flutter/example
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          cache: true
          pub-cache-key: flutter-pub-:os:-:channel:-:version:-:arch:-integration-${{ hashFiles('hive/pubspec.yaml', 'hive_flutter/pubspec.yaml', 'hive_flutter/example/pubspec.yaml') }}
      - name: Set up Linux
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build libgtk-3-dev
          Xvfb :99 &
          echo DISPLAY=:99 >> $GITHUB_ENV
      - name: Set up iOS
        if: matrix.platform == 'ios'
        run: |
          xcrun simctl shutdown all || true
          udid=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b
          echo "IOS_DEVICE=$udid" >> "$GITHUB_ENV"
      - name: Set up Android
        if: matrix.platform == 'android'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Setup Gradle
        if: matrix.platform == 'android'
        uses: gradle/actions/setup-gradle@v6
      - name: Cache AVD
        if: matrix.platform == 'android'
        id: avd-cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api-35-x86_64
      - name: Create AVD snapshot for caching
        if: matrix.platform == 'android' && steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."
      - name: Run tests
        if: matrix.platform != 'android' && matrix.platform != 'ios'
        run: flutter test integration_test -d ${{ matrix.device }}
      - name: Run tests (iOS)
        if: matrix.platform == 'ios'
        run: |
          python3 - <<'EOF'
          import os, signal, subprocess, sys

          cmd = ["flutter", "test", "integration_test", "-d", os.environ["IOS_DEVICE"]]

          def run_once():
              proc = subprocess.Popen(cmd, start_new_session=True)
              try:
                  return proc.wait(timeout=360)
              except subprocess.TimeoutExpired:
                  os.killpg(proc.pid, signal.SIGTERM)
                  try:
                      proc.wait(timeout=10)
                  except subprocess.TimeoutExpired:
                      os.killpg(proc.pid, signal.SIGKILL)
                      proc.wait()
                  return 124

          rc = run_once()
          if rc == 124:
              print("::warning::iOS integration test timed out after 360s; rebooting simulator and retrying once.", flush=True)
              udid = os.environ["IOS_DEVICE"]
              subprocess.run(["xcrun", "simctl", "shutdown", udid], check=False)
              subprocess.run(["xcrun", "simctl", "boot", udid], check=False)
              subprocess.run(["xcrun", "simctl", "bootstatus", udid, "-b"], check=True)
              rc = run_once()
          sys.exit(rc)
          EOF
      - name: Run tests (Android)
        if: matrix.platform == 'android'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: hive_flutter/example
          script: flutter test integration_test -d ${{ matrix.device }}

  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs:
      - changes
      - dart-checks
      - flutter-checks
      - test-hive
      - test-hive_generator-windows
      - coverage-hive
      - ensure-codegen
      - ensure-embedme
      - integration-test-hive_flutter
    steps:
      - name: Verify required checks
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'EOF'
          import json, os, sys

          needs = json.loads(os.environ["NEEDS_JSON"])
          bad = {
              k: v.get("result")
              for k, v in needs.items()
              if v.get("result") not in ("success", "skipped")
          }
          if bad:
              print(f"::error::Required checks failed: {bad}")
              sys.exit(1)
          EOF
